[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "capsprom"
version = "0.1.0"
description = "Reproducible promoter prediction research pipeline"
requires-python = ">=3.13"

[project.scripts]
capsprom = "capsprom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
