treatment:
  name: graphpro-epd-downstream-treated-v1
  version: 1.0.0
  status: exploratory_source_reproduction_treatment
  sequence_recreation_contract: configs/graphpro_epd_sequence_recreation_v1.yaml
  specification: specs/graphpro_dataset_reconstruction.md
  output_is_primary_reconstruction: false

policy:
  input_integrity_stage: graphpro-released-eukaryotic-integrity-v1
  remove_within_class_reverse_complement_duplicates: true
  downstream_relative_start: 1000
  downstream_relative_end_exclusive: 1081
  known_tss_exclusion_margin_nt: 100
  tss_inventory: union_of_epdnew_coding_and_noncoding
  tss_proximity_removes: negative_record_only
  rationale: >-
    Mouse released classes are not completely paired by EPD identifier. Removing
    a positive solely because a distinct downstream control is invalid would
    discard an independently valid promoter and silently impose a pairing that
    the source files do not define. Shared EPD identifiers remain indivisible
    groups during future partitioning.
  rebalance_after_filtering: false

