acquisition:
  name: reference-acquisition-v1
  version: 1.0.0
  protocol: specs/reference_coordinate_mapping_protocol.md
  audit: docs/coordinate_mapping_gap_inventory.md
  root: data/acquired/reference_acquisition_v1
  frozen_on: 2026-10-29
  policy: >-
    Reference annotations used to verify source coordinates and TSS positions.
    Kept apart from source_acquisition_v1, which stays unchanged. UCSC database
    tables have no published digest; they are recorded on first acquisition and
    verified against the manifest thereafter. A UCSC table is a snapshot of the
    day it is downloaded, not of the day a source dataset was built.

sources:
  # RefSeq transcript tables (genePred) that the UCSC Table Browser reads for
  # the "NCBI RefSeq" tracks named in the Bhandari headers.
  - source_id: ucsc-refseq-tables
    kind: url_list
    study: ucsc_genome_browser
    landing_page: https://hgdownload.soe.ucsc.edu/downloads.html
    files:
      - path: hg38/ncbiRefSeqCurated.txt.gz
        url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/ncbiRefSeqCurated.txt.gz
      - path: hg38/ncbiRefSeqCurated.sql
        url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/database/ncbiRefSeqCurated.sql
      - path: sacCer3/ncbiRefSeq.txt.gz
        url: https://hgdownload.soe.ucsc.edu/goldenPath/sacCer3/database/ncbiRefSeq.txt.gz
      - path: sacCer3/ncbiRefSeq.sql
        url: https://hgdownload.soe.ucsc.edu/goldenPath/sacCer3/database/ncbiRefSeq.sql
      - path: mm10/ncbiRefSeq.txt.gz
        url: https://hgdownload.soe.ucsc.edu/goldenPath/mm10/database/ncbiRefSeq.txt.gz
      - path: mm10/ncbiRefSeq.sql
        url: https://hgdownload.soe.ucsc.edu/goldenPath/mm10/database/ncbiRefSeq.sql
