status_definitions:
  verified_coordinates_and_assembly: >-
    Row coordinates, strand, assembly, source identifiers, and sequence
    recreation are hash-bound and independently checked.
  embedded_coordinates_require_recreation: >-
    Local headers contain coordinates and an assembly token, but complete
    assembly recreation and coordinate-convention validation are pending.
  identifiers_require_external_resolution: >-
    Stable-looking identifiers exist, but a dated source release and assembly
    must be resolved before coordinates can be used.
  assembly_known_coordinates_absent: >-
    A publication documents the organism assembly, but the local archive has
    sequence-only rows with no row-level coordinate or identifier.
  insufficient_or_conflicting_identity: >-
    The local name and observed metadata conflict or do not identify a unique
    biological source.

