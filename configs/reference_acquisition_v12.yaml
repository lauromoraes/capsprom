acquisition:
  name: reference-acquisition-v12
  version: 1.0.0
  protocol: specs/cds_negative_control_protocol.md
  root: data/acquired/reference_acquisition_v12
  frozen_on: 2026-11-02
  policy: >-
    RefSeq annotation (GFF3), genomic FASTA, and assembly report of the exact
    assemblies that carry the reconstructed GraphPro TSS coordinates of
    C. jejuni (NC_002163.1), C. pneumoniae (NC_000922.1), and L. interrogans
    (NZ_LT962963.1), for the CDS-derived negative-control condition
    (configs/cds_negative_control_v2.yaml). On 2026-11-02 NCBI esummary
    reported each accession.version as live and not replaced. MD5 digests from
    each NCBI directory's md5checksums.txt, read on 2026-11-02. The
    GCF_000009085.1 GFF has no annotation-date header; its HTTP Last-Modified
    is recorded in the manifest.

