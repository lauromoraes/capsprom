manifest:
  name: confirmatory-eligible-v3-plus-graphpro-v3-dependency-v4
  status: reviewed_complete_for_eligible_scope_plus_candidates
  supersedes: configs/dataset_dependency_manifest_v3.yaml
  eligibility_manifest: configs/dataset_eligibility_manifest_v1.yaml
  dataset_count: 21
  eligible_dataset_count: 18
  candidate_dataset_count: 3
  dependency_cluster_count: 14
  cluster_rule: shared_source_pool_or_observed_exact_or_alignment_overlap
  alignment_criterion: >-
    MMseqs2 nucleotide search, both strands, identity >= 0.80 and coverage
    >= 0.80 of both 81-nt sequences (F-084 settings), train and test pooled.
    A dataset pair with more than 10 records having a cross-dataset neighbour
    is joined into one cluster.
  evidence: [F-114, R-033, F-125, R-051]
  changes_from_v3:
    - graphpro-reconstructed-v3-prokaryotic-chlamydophila_pneumoniae joins cdbprom-chlamydophila (404 exact and 419 alignment-linked shared positives, all same label)
    - graphpro-reconstructed-v3-prokaryotic-campylobacter_jejuni forms its own cluster (no exact or alignment neighbour)
    - graphpro-reconstructed-v3-prokaryotic-leptospira_interrogans forms its own cluster (no exact or alignment neighbour)
  candidate_status: >-
    The three graphpro-reconstructed-v3 datasets are candidates, not eligible
    datasets; listing them assigns clusters only. Their CDS-derived panels are
    conditions of the same dataset and share its cluster.
  limitations:
    - Exact or alignment non-overlap does not prove biological independence.
    - Pairs with at most 6 records having a neighbour remain separate clusters.
    - Dataset-level effects within one dependency cluster are aggregated before inference.

datasets:
