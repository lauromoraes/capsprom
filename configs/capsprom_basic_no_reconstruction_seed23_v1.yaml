project:
  name: capsprom-basic-no-reconstruction-seed23-v1
data: &data
  train_csv: data/processed/assembled_datasets/intra_regenerated_v3_strict_dna/graphpro-prokaryotic-clostridium_phytofermentans-p-402-n-345-train.csv
  sequence_column: sequence
  label_column: label
  sequence_length: 81
  maximum_samples: null
model: &model
  name: capsprom_basic
  architecture:
    convolution_filters: 256
    convolution_kernel: 9
    primary_channels: 32
    primary_dim: 8
    primary_kernel: 9
    primary_stride: 2
    output_capsules: 2
    output_dim: 16
    routing_iterations: 3
    routing_mode: dynamic
    routing_gradient_mode: final_iteration
    decoder_mode: selected_vector
    decoder_hidden: [512, 1024]
training:
  contract_version: 3
  random_seed: 23
  validation_fraction: 0.2
  batch_size: 64
  learning_rate: 0.001
  maximum_epochs: 30
  patience: 15
  reconstruction_weight: 0.0
  reconstruction_reduction: mean
tracking: &tracking
  tracking_uri: sqlite:///mlflow.db
  experiment_name: capsprom-phase4-development
outputs:
  checkpoint_path: outputs/neural_smoke/capsprom_basic_no_reconstruction_seed23_v1/best.pt
  state_path: outputs/neural_smoke/capsprom_basic_no_reconstruction_seed23_v1/state.json
