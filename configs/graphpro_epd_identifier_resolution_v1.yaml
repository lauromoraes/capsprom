policy:
  primary_collection: noncoding
  rationale: >-
    Every released GraphPro human and mouse identifier resolves in the respective
    EPDnewNC collection. Coding-collection matches are retained as alternative
    annotations and do not override the EPDnewNC coordinate.
  released_class_is_biological_evidence: false
  embedded_header_label_is_biological_evidence: false
  generate_reconstructed_sequences: false

