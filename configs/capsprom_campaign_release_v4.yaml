release:
  name: capsprom-campaign-release-v4
  version: 4.0.0
  status: draft_pending_explicit_authorization
  drafted_on: 2026-10-27
  authorized_on: null
  authorization_source: null
  predecessor: configs/capsprom_campaign_release_v3.yaml
  # The unit is fixed by remote_operations.build_pending_fold_schedule (smallest
  # dataset, then seed, then fold), not chosen from seed-13 outcomes.
  selection_basis: deterministic_pending_fold_schedule

scope:
  execution_contract: configs/capsprom_basic_canonical_gpu_execution_v4.yaml
  eligible_dataset_count: 18
  graphpro_included: false
  dataset_id: cdbprom-prokaryotic-chlamydophila_pneumoniae
  seed: 29
  folds: [0, 1, 2, 3, 4]
  maximum_new_inner_fits: 5
  host: bioserver03
  gpu_workers: 1

preconditions:
  - synchronize the locally validated readiness implementation to bioserver03 without changing the v4 contract
  - run refresh-neural-canonical-readiness on the v4 plan; seed 13 must become ready_for_final_fit with selected epoch 30
  - reverify v4 contract, dataset, and fold-manifest hashes on bioserver03
  - inspect manifests/remote_jobs.json and the host for an equivalent job before launch

scientific_boundaries:
  training_data_only: true
  reuse_previous_30_epoch_folds: false
  restart_each_fold_from_epoch_one: true
  maximum_epochs: 50
  patience: 15
  epoch_selection_rule: lower_median_fold_best_epoch
  model_outcomes_may_not_expand_tranche: true

execution_requirements:
  persistent_asynchronous_launcher: true
  remote_job_registry: manifests/remote_jobs.json
  atomic_plan_state: true
  mlflow_parent_child_tracking: true
  inspect_for_equivalent_job_before_launch: true

execution_gates:
  authorized_inner_folds_enabled: false
  additional_inner_folds_enabled: false
  final_fits_enabled: false
  external_test_enabled: false
  embedding_jobs_enabled: false
