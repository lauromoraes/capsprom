  version: 1.0.0
  status: exploratory_integrity_treatment
  source_family: released_graphpro
  output_is_reconstruction: false
  confirmatory_use_enabled: false

policy:
  sequence_length: 81
  alphabet: ACGT
  cross_label_collision: remove_all_occurrences_from_both_classes
  within_class_duplicate: retain_first_in_source_order
  unresolved_epd_identifier: retain_for_exploratory_integrity_view_only
  unresolved_epd_identifier_rationale: >-
    The reconstruction contract excludes unresolved identifiers from a future
    independently reconstructed positive set, but no dated EPD release and
    assembly have yet been frozen. Removing every released row here would not
    create a reconstructed dataset and would leave no sequence-logo population.

