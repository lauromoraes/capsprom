project: {name: capsprom-basic-warmup-seed37-v1}
data:
  train_csv: data/processed/assembled_datasets/intra_regenerated_v3_strict_dna/graphpro-prokaryotic-clostridium_phytofermentans-p-402-n-345-train.csv
  sequence_column: sequence
  label_column: label
  sequence_length: 81
  maximum_samples: null
model:
  name: capsprom_basic
  architecture:
    convolution_filters: 256
    convolution_kernel: 9
    primary_channels: 32
    primary_dim: 8
    primary_kernel: 9
    primary_stride: 2
    output_capsules: 2
    output_dim: 16
    routing_iterations: 3
    routing_mode: dynamic
    routing_gradient_mode: final_iteration
    decoder_mode: disabled
    decoder_hidden: [512, 1024]
training:
  contract_version: 6
  random_seed: 37
  validation_fraction: 0.2
  batch_size: 64
  learning_rate: 0.001
  learning_rate_schedule: linear_warmup
  learning_rate_decay: 1.0
  warmup_initial_learning_rate: 0.0001
  warmup_epochs: 5
  maximum_epochs: 30
  patience: 15
  reconstruction_weight: 0.0
  reconstruction_reduction: mean
tracking: {tracking_uri: sqlite:///mlflow.db, experiment_name: capsprom-phase4-development}
outputs:
  checkpoint_path: outputs/neural_smoke/capsprom_basic_warmup_seed37_v1/best.pt
  state_path: outputs/neural_smoke/capsprom_basic_warmup_seed37_v1/state.json
