      - path: GCF_000001735.4.chromAlias.txt
        url: https://hgdownload.soe.ucsc.edu/hubs/GCF/000/001/735/GCF_000001735.4/GCF_000001735.4.chromAlias.txt
        expected: {md5: e54deaaea7576c6bc134e1ba493e313a}
      - path: GCF_000001735.4_assembly_report.txt
