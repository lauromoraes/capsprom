# Canonicalization contract v1. Immutable once its canonical manifest exists; create v2 to change it.
canonicalization:
  name: source-canonicalization-v1
  version: 1.0.0
  protocol: specs/source_acquisition_protocol.md
  acquisition_config: configs/source_acquisition_v1.yaml
  acquisition_manifest: data/acquired/source_acquisition_v1/acquisition_manifest.json
  acquired_root: data/acquired/source_acquisition_v1
  output_dir: data/canonical/source_canonicalization_v1
  cleaning: whitespace removed and bases uppercased; no record is dropped, cropped, padded or relabelled
  status_rule: pass requires exact release counts per class and, where declared, identical per-class sequence multisets
    with the legacy data/raw copy
collections:
- collection_id: bhandari-human
  source: bhandari
  domain: eukaryotic
  organism: Homo sapiens (hg38)
  expected_length: 1000
  publication_counts:
    positive: 61546
  inputs:
  - file: bhandari-drive/Human_promoter.gz
    format: fasta
    source_class: positive
    label: 1
    expected_records: 61546
    tss_index: 700
  legacy_inputs:
  - path: data/raw/Bhandari_etal/Human_promoter.fa
    format: fasta
    source_class: positive
  notes: Window -700..+299 around the TSS (headers up_700 and 3-prime pad 300). Published negatives are synthetic
    shuffles and are not distributed.
- collection_id: bhandari-yeast
  source: bhandari
  domain: eukaryotic
  organism: Saccharomyces cerevisiae (sacCer3)
  expected_length: 1000
  publication_counts:
