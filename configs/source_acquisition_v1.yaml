acquisition:
  name: source-acquisition-v1
  version: 1.0.0
  protocol: specs/source_acquisition_protocol.md
  audit: docs/dataset_reconstruction_sources.md
  root: data/acquired/source_acquisition_v1
  frozen_on: 2026-10-27
  policy: >-
    GitHub sources are pinned to a full commit and every blob must reproduce the
    Git blob SHA-1 listed by that commit's tree. Direct URLs are verified against
    every digest declared below; files without a declared digest are recorded on
    first acquisition and verified against the manifest thereafter.

