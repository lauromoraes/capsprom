      - {dataset_id: cdbprom-prokaryotic-corynebacterium_glutamicum, path: data/processed/assembled_datasets/grouped_domain_window_v1/cdbprom-prokaryotic-corynebacterium_glutamicum/records.csv, sha256: b29765405c878f39533629f0eda5030069d485f276a231ef86a37b07dee998f9}
