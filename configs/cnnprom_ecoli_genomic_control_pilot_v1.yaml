pilot:
  name: cnnprom-ecoli-genomic-control-pilot-v1
  version: 1.0.0-draft
  status: design_decisions_resolved_execution_blocked
  specification: specs/negative_control_protocol.md
  reconstruction_rules: specs/graphpro_dataset_reconstruction.md
  research_log: R-064
  condition: genomic_gc_matched
  domain: prokaryota
  dataset_id: cnnprom-ecoli-sigma70.recon-genomic-v1
  source_collection: cnnprom-ecoli-sigma70
  original_labels_modified: false
  output_is_new_derived_dataset: true
  confirmatory_use_enabled: false
  rationale: >-
    First genomic GC-matched panel for a source-native dataset. CNNProm E. coli
    native negatives are opposite-strand CDS windows (F-129), so this panel
    adds a genome-background test beside the coding-background native panel
    for the same positives. The complete TSS exclusion set exists (RegulonDB
    union, F-132) and capacity does not constrain the panel (F-133).
  execution_gates:
    open_decisions_resolved: true
    contract_frozen: false
    builder_fixture_tested: false
    controls_generated: false
    distribution_and_dependency_audit: false
    manual_sample_audit: false
    eligibility_manifest_approved: false

reference:
  acquisition: configs/reference_acquisition_v10.yaml
  genome_fasta: data/acquired/reference_acquisition_v10/cnnprom-ecoli-k12/GCF_000005845.2_ASM584v2_genomic.fna.gz
  genome_fasta_sha256: a96d3cfa58c88d477013c768f90a11d2386d42a70d566abfb6d9013dcbd24255
  assembly: GCF_000005845.2
  contig: NC_000913.3
  source_coordinate_frame: NC_000913.2_F-098
  placement: exact_both_strand_search_of_canonical_sequence
  placement_rationale: >-
    Same placement as configs/ecoli_control_capacity_v1.yaml; the RegulonDB
    union and the capacity count are on NC_000913.3, so no coordinate lift
    from NC_000913.2 is applied.

window:
  policy: specs/sequence_window_policy.md
  upstream: 60
  include_tss_base: true
  downstream: 20
  length: 81
  tss_index: 60
  orientation: transcription_five_prime_to_three_prime

positive_policy:
  source: cnnprom_native_positives_mapping_v3
  mapping_records: data/coordinates/reference_coordinate_mapping_v3/records/cnnprom-ecoli-sigma70.csv.gz
  canonical_table: data/canonical/source_canonicalization_v1/cnnprom-ecoli-sigma70.csv.gz
  label_change: never
  window_recropping: never
  stable_source_order: canonical_record_order
  tss_support_reference: regulondb_union_same_strand
  multiple_loci:
    rule: >-
      Resolve to the locus whose TSS is in the RegulonDB union with the same
      promoter name as the CNNProm header and whose position agrees with the
      header coordinate under the NC_000913.2 to NC_000913.3 offset. A record
      with no such locus, or with more than one, is unresolved.
    header_offset_rule: >-
      The NC_000913.2 to NC_000913.3 offset at a header coordinate is that of
      the nearest single-locus positive whose header strand agrees with its
      locus (target 1-based TSS minus header coordinate; ties to the lower
      coordinate).
    header_agreement_tolerance_nt: 2
    resolved_status: multiple_resolved
    unresolved_action: exclude_from_genomic_panel_and_count
    exclusion: every_locus_of_the_record
    ledger_fields: [all_loci, resolved_locus, resolution_evidence]
    observed_cases:
      - record: cnnprom-ecoli-sigma70:cnnprom/Ecoli_prom.fa:0000653
        promoter: rrsAp2
        loci: 2
        note: both loci are union TSSs (rrsAp2, rrsBp2); header selects rrsAp2
      - record: cnnprom-ecoli-sigma70:cnnprom/Ecoli_prom.fa:0000300
        promoter: gltIp1
        loci: 11
        note: one locus (687895, minus) is the PromoterSet gltIp1 TSS; ten have no TSS nearby
  tss_support_classes:
    exact: TSS position and strand in the union
    near: same-strand union TSS within the tolerance
    shifted: same-strand PromoterSet TSS with the same promoter name beyond the tolerance
    none: none of the above
  near_tolerance_nt: 2
  class_actions:
    exact: keep_both_panels
    near: keep_both_panels_record_distance
    shifted: keep_both_panels_record_distance_exclude_from_positional_analyses
    none: keep_native_panel_only_exclude_from_genomic_panel_and_count
  observed_cases:
    - record: cnnprom-ecoli-sigma70:cnnprom/Ecoli_prom.fa:0000681
      promoter: serWp
      nearest_union_tss_offset_nt: 1
      expected_class: near
    - record: cnnprom-ecoli-sigma70:cnnprom/Ecoli_prom.fa:0000631
      promoter: rplUp
      nearest_union_tss_offset_nt: 1
      expected_class: near
    - record: cnnprom-ecoli-sigma70:cnnprom/Ecoli_prom.fa:0000029
      promoter: araCp
      nearest_union_tss_offset_nt: -18
      expected_class: shifted
  observed_cases_status: >-
    Identified by an unversioned scratch script on 2026-11-04. The builder must
    reproduce them from versioned code before the contract is frozen.

negative_policy:
  controls_per_positive: 1
  control_strand: same_as_positive
  sampling_seed: 20261104
  control_selection:
    rule: nearest_gc_first
    description: >-
      Among windows that pass every exclusion rule below, choose the one with
      the smallest absolute G/C count difference to its positive; the
      four-base maximum stays a hard ceiling. Within one distance, candidates
      are tried in a permutation seeded by sampling_seed and the positive
      locus. Positives are processed in stable source order.
    implementation: capsprom.data.ecoli_genomic_pilot.select_nearest_gc_controls
    differs_from: >-
      The v3 bacterial genomic panels accept the first candidate within the
      caliper (configs/graphpro_reconstruction_v3.yaml). Their GC gaps and this
      panel's are not compared as one rule.
    rationale: >-
      F-124: first-accepted sampling leaves controls GC-richer than AT-rich
      positives because genome density inside the caliper is asymmetric.
      Capacity (F-133, about 26 free slots per positive) makes nearest-first
      selection affordable.
  maximum_gc_count_difference: 4
  exclusion_radius_nt: 100
  exclusion_radius_rule: r_equals_upstream_60_plus_margin_40_log_R-036
  exclusion_strands: both
  regulondb_acquisition: configs/regulondb_tss_acquisition_v1.yaml
  exclusion_set:
    - regulondb_union_configs/regulondb_tss_acquisition_v1.yaml
    - every_locus_of_every_positive
  regulondb_out_of_range_rows: drop_and_count
  strict_dna_only: true
  selected_control_overlap: reject
  native_negative_overlap: reject
  identity_with_positive_or_control: reject_forward_and_reverse_complement
  external_active_positive_identity:
    rule: reject_control_matching_active_external_positive
    dependency_manifest: configs/dataset_dependency_manifest_v4.yaml
    dependency_manifest_sha256: e46826c6c5eb08acfa9acc1b3ac3b5665379fb781fe1ea34d306730178efcee0
    dataset_count: 21
    orientation: forward_and_reverse_complement
    external_labels_modified: false
    window_length_nt: 81
    length_rule: >-
      Only 81-nt positives can equal an 81-nt control; the 251-nt eukaryotic
      positives are read and cannot match.
    positive_source_rule: >-
      The 18 eligible datasets are read from their grouped domain-window build
      (the records evaluation protocol v4 uses, label 1); the three
      graphpro-reconstructed-v3 candidates have no grouped build and are read
      from their v3 pair ledgers (positive_sequence).
