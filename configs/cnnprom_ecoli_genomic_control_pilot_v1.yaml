    limitation: ignores competition between positives; real failures appear in control_failures.csv
    observed: >-
      Log R-067: 1,525,588 admissible windows; every one of the 839 genomic
      panel positives has an admissible window at GC distance 0; no admissible
      window equals an active external positive.
  residual_gc_gap: measured_as_diagnostic_not_a_construction_input
  gc_only_reference: reported_beside_every_model_R-052

grouping_and_split:
  protocol: configs/homology_grouping_v1.yaml
  protocol_sha256: 3149853dc5cc563bd90846b844b354c8b6487c3f02f5eaa4213541d60fe46ebc
  mmseqs2_binary_sha256: b7ef6e0e33df5dd4fa9cf988cbd8b4988c11a3a1255d2c377f13e1bb40c157fb
  pair_is_indivisible: true
  genomic_overlap_edges: required
  shared_groups_with_native_panel: required
  native_partition_preserved: true
  cross_partition_link_action: exclude_pair_from_genomic_panel_and_record
  native_build:
    dataset_id: cnnprom-prokaryotic-Ecoli
    records: data/processed/assembled_datasets/grouped_domain_window_v1/cnnprom-prokaryotic-Ecoli/records.csv
    records_sha256: 36e0901afe3f3f52e892ff1c08c3abe560639c05775d34c314aecbe131e5daf1
    build_manifest_sha256: 216640248eda3fa52c670e294deb753ed85147f178dac0ef649b35aae4b29c79
    record_match: label_and_sequence_one_to_one_both_labels_or_abort
    observed_match: 839 positives (168 test, 671 train) and 3000 negatives, one to one (log R-067)
  assignment_rule: >-
    Each positive keeps the group and partition (test or train fold) of its
    grouped-build record; its control inherits both. The native split is never
    recomputed (the precedent is scripts/build_cds_controls_v3.py).
  edge_records: every_native_record_plus_every_control
  edges: [alignment, hamming, genomic_overlap]
  genomic_overlap_coordinates: >-
    Controls and single-locus positives; multi-locus positives and native
    negatives take sequence edges only (homology grouping v1,
    multi_locus_records). Native negatives are blocked from overlapping a
    control by negative_policy.native_negative_overlap.
  cross_partition_rule: >-
    A control with an edge to a record whose partition label differs from its
    own (test or train fold) is dropped with its pair and recorded in
    cross_partition_drops.csv; the positive stays in the native panel.
  test_intersection: genomic_panel_test_positives_written_to_test_intersection_csv

statistics:
  panels_reported_separately: true
  cross_panel_comparison: intersection_of_test_positives_fixed_from_build_ledgers
  selection_use: forbidden

resolved_decisions:
  decided_on: 2026-11-04
  decided_by: project_owner
  all_proposals_accepted: true
  items:
    - id: sampling_seed
      decision: 20261104, a new dated value distinct from every existing sampling and run seed (specs/seed_policy.md)
    - id: native_negative_overlap
      decision: >-
        Reject controls overlapping a native CNNProm negative window, so the two
        negative panels share no bases; native negatives are CDS-derived (F-129).
    - id: residual_gc_gap
      decision: >-
        Superseded on 2026-11-04 (log R-066): the residual positive-minus-control
        GC gap is measured as a diagnostic, not a construction input; the
        GC-only reference is reported beside every model regardless.
    - id: control_selection
      decided_on: 2026-11-04
      decision: >-
        Nearest GC first with the four-base caliper as a hard ceiling (log
        R-066).
    - id: external_active_positive_identity_scope
      decided_on: 2026-11-04
      decision: >-
        All 21 datasets of dependency manifest v4, eligible ones from their
        grouped build and the three candidates from their v3 pair ledgers, each
        file hash-pinned (log R-067).
    - id: grouping_and_split_assignment
      decided_on: 2026-11-04
      decision: >-
        Inherit the native group and partition from the grouped build by
        one-to-one sequence match; controls inherit their positive's; drop
        pairs whose control links to another partition (log R-067).
    - id: real_data_validation
      decided_on: 2026-11-04
      decision: >-
        A static capacity check on real data runs in plan mode; the frozen
        contract then generates controls once, reverified independently and
        followed by the distribution, dependency and manual audits (log R-067).
    - id: near_tolerance_nt
      decision: 2
    - id: shifted_class_in_genomic_panel
      decision: >-
        Keep araCp-type records in both panels (the label is supported) and
        exclude them only from positional analyses; the window is not recropped.
