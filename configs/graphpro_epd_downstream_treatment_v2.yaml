treatment:
  name: graphpro-epd-downstream-treated-v2
  version: 2.0.0
  status: exploratory_external_positive_exclusion
  upstream_treatment_contract: configs/graphpro_epd_downstream_treatment_v1.yaml
  specification: specs/graphpro_dataset_reconstruction.md
  output_is_primary_reconstruction: false

policy:
  input_stage: graphpro-epd-downstream-treated-v1
  external_positive_identity: minimum_forward_or_reverse_complement
  external_positive_match_removes: graphpro_negative_record_only
  expected_removed_count: 1
  expected_removed_identifiers:
    - FP002834|Gm50063_1
  rationale: >-
    A genomic control cannot remain in this candidate condition when its exact
    strand-invariant identity is labeled positive in an active external source.
    Removing the GraphPro control does not validate the external biological
    label and does not modify the external dataset.
  rebalance_after_filtering: false

