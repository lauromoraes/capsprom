review:
  name: graphpro-v3-manual-sample-review-v1
  version: 1.0.0
  status: sample_frozen_review_pending
  research_log: R-057
  eligibility_gate: specs/graphpro_dataset_reconstruction.md#eligibility-gates (gate 7, independent manual sample audit)
  reviewer: project_owner
  model_outcomes_used: false

sampling:
  pairs_per_dataset: 20
  selection: lowest_sha256_rank
  canonical_key: pair_id
  key_material: "graphpro-v3-manual-review-v1:<pair_id>"
  strand_stratification: {enabled: true, target_per_strand: 10}
  partitions: all
  frozen_before_review: true

datasets:
  - {collection_id: graphpro-cje, ledger: data/interim/graphpro_reconstructed_v3/graphpro-reconstructed-v3-prokaryotic-campylobacter_jejuni/pair_ledger.csv, manifest_sha256: 2ca8f3d383a4c09760aa320c656e4467458c287104b637ca38bf5651152b8155, cds_ledger: data/interim/graphpro_reconstructed_v3_cds_v1/graphpro-reconstructed-v3-prokaryotic-campylobacter_jejuni/cds_pair_ledger.csv, primary_source: "PMID 23696746, Table S4, sheet NCTC11168"}
  - {collection_id: graphpro-cpne, ledger: data/interim/graphpro_reconstructed_v3/graphpro-reconstructed-v3-prokaryotic-chlamydophila_pneumoniae/pair_ledger.csv, manifest_sha256: 3e73b6b384e495909d65f5943a1e9a0680fe29ad47f353d83be95bd95c314305, cds_ledger: data/interim/graphpro_reconstructed_v3_cds_v1/graphpro-reconstructed-v3-prokaryotic-chlamydophila_pneumoniae/cds_pair_ledger.csv, primary_source: "PMID 21989159, Additional file 2, sheet TSS"}
  - {collection_id: graphpro-lint, ledger: data/interim/graphpro_reconstructed_v3/graphpro-reconstructed-v3-prokaryotic-leptospira_interrogans/pair_ledger.csv, manifest_sha256: 8ec1a64b9967aa5b6a822ef5ce4570f3af33372bedc03bfbb3017a80bd83b7ab, primary_source: "PMID 28154810, Table 4, sheet TSS-30_all (positives); both sheets (exclusion)"}

checks:
  A_positive_in_primary_table: one-based position and strand appear in the primary table with a primary or secondary class
  B_positive_sequence: the window equals the reference interval of the NCBI link, oriented on the given strand
  C_control_sequence_and_strand: the genomic control equals its NCBI interval on the positive's strand
  D_control_tss_margin: no primary-table TSS of any class lies within 100 nt of the control on either strand
  E_cds_control: the CDS control lies inside one annotated CDS, on its sense strand, at least 60 nt from both ends (Cje and Cpne only)

decision_rule:
  row_pass: every applicable check is yes
  dataset_pass: all sampled rows pass
  failure_policy: keep_dataset_blocked_report_the_row_and_open_a_finding_without_relabeling
