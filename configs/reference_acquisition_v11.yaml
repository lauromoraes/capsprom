acquisition:
  name: reference-acquisition-v11
  version: 1.0.0
  protocol: specs/reference_coordinate_mapping_protocol.md
  root: data/acquired/reference_acquisition_v11
  frozen_on: 2026-10-31
  policy: >-
    Alternative strain and version assemblies used to test why 180 CDBProm
    records have no exact locus on the ref-acq-v10 assemblies (F-092, F-093),
    and the earlier E. coli K-12 sequence NC_000913.2 used to test F-095.
    Candidates only; none is assumed to be the source genome. MD5 digests from
    each NCBI directory's md5checksums.txt, read on 2026-10-31. NCBI efetch
    publishes no digest for NC_000913.2; it is recorded on first acquisition.

