  version: 1.0.0
  status: execution_enabled
  research_log: R-055
  evaluation_protocol: configs/evaluation_protocol_v4.yaml
  evaluation_protocol_sha256: cad1b4daea60834c1f1400844e5046834ebb0f5e15b5727f8efb59264a92fcb2
  condition: orig
  dataset_identity_pattern: <dataset_id>.orig-grouped-v1
  rationale: Repartition the 18 eligible datasets by homology grouping v1 with domain windows (R-054).
    Prokaryotic records are the v3 filtered records pooled across train and test, so the record-level
    v3 partition remains a like-for-like sensitivity. Eukaryotic records are rebuilt from the canonical
    collections at the native 251-nt window.
filters_for_canonical_sources:
  length_exclusion: drop_length_matches_expected_false
  strict_dna: true
  cross_label_collision: remove_every_occurrence_in_both_classes_forward_exact_as_v3
  within_class_duplicates: keep_first_in_record_index_order
grouping:
  protocol: configs/homology_grouping_v1.yaml
  protocol_sha256: 3149853dc5cc563bd90846b844b354c8b6487c3f02f5eaa4213541d60fe46ebc
  edges:
  - alignment
  - hamming
  genomic_overlap: not_applied_no_verified_unique_coordinates_in_orig_condition
  mmseqs2_binary_sha256: b7ef6e0e33df5dd4fa9cf988cbd8b4988c11a3a1255d2c377f13e1bb40c157fb
  test_fraction: 0.2
  assignment_seed: 42
  inner_folds: 5
  inner_fold_seed: 42
  oversized_component_action: block_and_review
  required_cross_partition_edges: 0
