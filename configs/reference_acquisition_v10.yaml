acquisition:
  name: reference-acquisition-v10
  version: 1.0.0
  protocol: specs/reference_coordinate_mapping_protocol.md
  root: data/acquired/reference_acquisition_v10
  frozen_on: 2026-10-31
  policy: >-
    Bacterial reference genomes for coordinate mapping of the eligible
    prokaryotic collections: the 11 CDBProm assemblies of R-011 (including the
    two replacements; the rejected accessions stay recorded in
    data/raw/references/cdbprom_genomes_v1/manifest.json) and the CNNProm
    E. coli K-12 MG1655 and B. subtilis 168 assemblies. Brings into an
    acquisition manifest the genomes that F-027 lists as raw-only. MD5 digests
    are from each NCBI directory's md5checksums.txt, read on 2026-10-31.

