out_of_scope:
  bacillus_amyloliquefaciens: primary_coordinate_supplement_not_acquired
  rhodobacter_capsulatus: no_primary_table_matching_promotech_rows
  escherichia_coli_paa: excluded_log_R-040
  human_and_mouse: separate_251_nt_eukaryotic_successor

required_outputs:
  - positive_ledger_with_class_sets_and_source_rows
  - pair_ledger_with_rejection_counters
  - failure_ledger
  - filtering_ledger
  - exclusion_reverification_report
  - homology_group_table_and_edge_report
  - group_safe_split_manifest
  - exact_and_near_duplicate_audits
  - distribution_report
  - file_hash_manifest

execution_gates:
  positive_extraction_enabled: false
  control_generation_enabled: false
  grouping_enabled: false
  split_enabled: false
  training_enabled: false
  confirmatory_use_enabled: false
