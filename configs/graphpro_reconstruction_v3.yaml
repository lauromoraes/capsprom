reconstruction:
  name: graphpro-reconstructed-v3
  version: 3.0.0
  supersedes_for_scope: configs/graphpro_reconstruction_v2.yaml
  status: design_locked_execution_blocked
  specification: specs/graphpro_dataset_reconstruction.md
  policy: configs/graphpro_deferral_policy_v2.yaml
  research_log: R-043
  condition: recon
  domain: prokaryota
  original_labels_modified: false
  output_is_new_derived_dataset: true
  reuses_v2_sequences_controls_or_split: false
  confirmatory_use_enabled: false
  rationale: >-
    v2 took positives from the Promotech BED and excluded only BED loci, so its
    L. interrogans controls fall inside primary-table TSS margins (F-116) and
    its split predates homology grouping. v3 takes positives from the verified
    primary tables under the P-or-S rule (R-039, R-042), excludes controls
    around every primary-table TSS, and partitions by homology groups.

reference:
  acquisition: configs/reference_acquisition_v12.yaml
  manifest: manifests/provenance/reference_acquisition_v12/acquisition_manifest.json
  file: refseq_genomic_fna
  identity_check: byte_identical_to_promotech_fasta_log_R-041

window:
  policy: specs/sequence_window_policy.md
  upstream: 60
  include_tss_base: true
  downstream: 20
  length: 81
  orientation: transcription_five_prime_to_three_prime

positive_policy:
  source: verified_primary_tss_table
  promotech_bed_role: corroboration_only
  coordinate_convention: primary_one_based_to_zero_based_tss
  class_rule: class_set_contains_primary_or_secondary
  keep_full_class_set_in_ledger: true
  biological_identity: [contig, zero_based_tss, strand]
  repeated_table_rows: keep_one_identity_and_record_multiplicity
  invalid_window: exclude_and_count
  invalid_window_definition: [non_acgt_base, outside_replicon_bounds]
  stable_source_order: zero_based_tss_then_strand

negative_policy:
  primary_condition: same_assembly_gc_matched_genomic_control
  controls_per_positive: 1
  control_strand: same_as_positive
  sampling_seed: 20261021
  max_attempts_per_positive: 100000
  exhaustive_fallback: deterministic_replicon_scan_reservoir_sampling
  separate_probe_and_scan_counters: true
  maximum_gc_count_difference: 4
  exclusion_radius_nt: 100
  exclusion_radius_rule: r_equals_upstream_60_plus_margin_40_log_R-036
  exclusion_strands: both
  exclusion_set: complete_primary_tss_table_all_classes
  strict_dna_only: true
  selected_control_overlap: reject
  identity_with_positive_or_control: reject_forward_and_reverse_complement
  external_active_positive_identity:
    rule: reject_control_matching_active_external_positive
    dependency_manifest: configs/dataset_dependency_manifest_v3.yaml
    dependency_manifest_sha256: 70a24063281b4d39958f8f9e76a3fdf346cc8d3c38a808ba3d90851e22f8c806
    dataset_count: 18
    processed_root: data/processed/assembled_datasets/intra_regenerated_v3_strict_dna
    orientation: forward_and_reverse_complement
    external_labels_modified: false
  failure_policy: drop_positive_after_exhaustive_scan_and_record
  rejection_counters_per_positive: true
  independent_reverification: find_control_exclusion_violations
  sensitivity_conditions:
    - configs/cds_negative_control_v2.yaml

post_generation_filter:
  identity: strand_invariant_exact_sequence
  cross_label_collision_policy: remove_every_affected_pair
  within_positive_duplicate_policy: retain_first_pair_in_stable_source_order
  within_negative_duplicate_policy: retain_first_pair_in_stable_source_order
  pair_integrity: always_remove_positive_and_control_together

grouping_and_split:
  protocol: configs/homology_grouping_v1.yaml
  pair_is_indivisible: true
  genomic_overlap_edges: required
  genomic_overlap_basis: build_coordinates_on_reference_assembly
  unit: dataset
  label_blind: true
  test_fraction: 0.20
  assignment_seed: 42
  inner_folds: 5
  inner_fold_seed: 42
  required_cross_partition_edges: 0
  oversized_component_action: block_and_review
  confirmatory_binding_requires: evaluation_protocol_v4

