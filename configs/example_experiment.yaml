project:
  name: capsprom
  language: en

tracking:
  backend: mlflow
  tracking_uri: ./mlruns
  experiment_name: capsprom-mvp

data:
  train_csv: data/processed/assembled_datasets/intra_strict_dna/bhandari-eukaryotic-Human_promoter-p-196756-n-196757-train.csv
  validation_csv: null
  test_csv: data/processed/assembled_datasets/intra_strict_dna/bhandari-eukaryotic-Human_promoter-p-49188-n-49187-test.csv
  sequence_column: sequence
  label_column: label
  sequence_length: 81
  alphabet: [A, C, G, T]

features:
  combination_mode: concatenate
  blocks:
    - name: kmer_frequency_3
      encoding: kmer_frequency
      k: 3
      normalize: true
    - name: one_hot_1
      encoding: one_hot
      k: 1
    - name: dinucleotide_physicochemical
      encoding: physicochemical
      k: 2
      reference_tsv: data/raw/references/normalized-dinuc.tsv
      properties:
        - Base stacking
        - Protein induced deformability
        - B-DNA twist
        - Dinucleotide GC Content
    - name: trinucleotide_physicochemical
      encoding: physicochemical
      k: 3
      reference_tsv: data/raw/references/normalized-trinuc.tsv
      properties:
        - Bendability (DNAse)
        - Bendability (consensus)
        - Trinucleotide GC Content
        - Nucleosome positioning
    - name: gc_content_skew
      encoding: gc_content_skew
      include_global: true
      window_size: 27
      step: 27
      include_skew: true
      include_at_skew: false
    - name: psednc_physicochemical
      encoding: pseknc
      k: 2
      reference_tsv: data/raw/references/normalized-dinuc.tsv
      properties:
        - Base stacking
        - B-DNA twist
        - Dinucleotide GC Content
      lambda_value: 3
      weight: 0.05
    - name: psetnc_physicochemical
      encoding: pseknc
      k: 3
      reference_tsv: data/raw/references/normalized-trinuc.tsv
      properties:
        - Bendability (DNAse)
        - Trinucleotide GC Content
      lambda_value: 3
      weight: 0.05
    - name: dna_bert_6_embedding
      encoding: dna_bert
      model_name: zhihan1996/DNA_bert_6
      k: 6
      pooling: mean
      max_length: 128

model:
  family: baseline
  name: xgboost
  input_mode: single_vector
  hyperparameters:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9

# Deep neural-network models may switch to multi-head inputs without changing
# the dataset definition. Each named feature block becomes one model input head.
deep_model_input_example:
  input_mode: multi_head
  heads:
    - feature_block: one_hot_1
      branch_type: convolutional
    - feature_block: dinucleotide_physicochemical
      branch_type: capsule_or_convolutional
    - feature_block: trinucleotide_physicochemical
      branch_type: capsule_or_convolutional
    - feature_block: gc_content_skew
      branch_type: dense
    - feature_block: psednc_physicochemical
      branch_type: dense
    - feature_block: dna_bert_6_embedding
      branch_type: dense_or_attention
  fusion: concatenate

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - matthews_corrcoef

outputs:
  artifact_dir: outputs/runs
  latex_dir: outputs/latex
