project:
  name: cnn-control-training-only-learnability-v1
data:
  train_csv: data/processed/assembled_datasets/intra_regenerated_v3_strict_dna/graphpro-prokaryotic-clostridium_phytofermentans-p-402-n-345-train.csv
  sequence_column: sequence
  label_column: label
  sequence_length: 81
  maximum_samples: 128
model:
  name: cnn_control
  architecture:
    convolution_filters: 256
    convolution_kernel: 9
    primary_channels: 32
    primary_dim: 8
    primary_kernel: 9
    primary_stride: 2
    output_capsules: 1
    output_dim: 16
    routing_iterations: 1
    routing_mode: uniform
    decoder_hidden: [512, 1024]
training:
  random_seed: 42
  validation_fraction: 0.2
  batch_size: 32
  learning_rate: 0.001
  maximum_epochs: 10
  patience: 3
  reconstruction_weight: 0.0
tracking:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: capsprom-phase4-development
outputs:
  checkpoint_path: outputs/neural_smoke/cnn_control_learnability_v1/best.pt
  state_path: outputs/neural_smoke/cnn_control_learnability_v1/state.json
